spring:
  application:
    name: codeSpark-backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/codespark
    username: postgres
    password: 123456

server:
  port: 8080
  servlet:
    context-path: /api
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: top.littlewin.codespark.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn