spring:
  application:
    name: codeSpark-backend
  # session 配置
  session:
    store-type: redis
    timeout: 2592000
  # postgres
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codespark}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
  # redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      ttl: 3600

server:
  port: 8080
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

# 应用自定义配置
codespark:
  password:
    # BCrypt 加密强度，范围 4~31，默认 10（2^10 = 1024 次迭代）
    strength: 10
    # 新建用户的默认密码
    default: ${DEFAULT_PASSWORD:12345678}
  ai:
    # App 名称生成使用独立轻量模型，避免与代码生成共用大模型导致响应慢
    app-name:
      # 是否启用 AI 为应用命名：false 时创建应用直接用提示词截取名，不再调用 AI（可用环境变量 APP_NAME_ENABLED 覆盖）
      enabled: ${APP_NAME_ENABLED:true}
    # 轻量模型（deepseek-chat）：路由判断、应用命名等简单任务共用，成本低、响应快
    light-model:
      model-name: ${LIGHT_MODEL_NAME:deepseek-chat}
      max-tokens: 512

# 阿里云 OSS 对象存储（V2 SDK）
aliyun:
  oss:
    # 是否使用 阿里云 OSS 服务，true为使用；默认关闭，可用环境变量 OSS_ENABLED 覆盖
    enabled: ${OSS_ENABLED:true}
    region: ${OSS_REGION:cn-beijing}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET:}
    # 自定义访问域名（CDN/自定义域名）：优先环境变量 OSS_DOMAIN，留空则用默认 Bucket 域名
    domain: ${OSS_DOMAIN:}
    # 预签名 URL 有效期（秒），用于私有读场景；24 小时可显著降低过期概率，配合前端失败重取兜底
    presign-expire-seconds: 86400

springdoc:
  group-configs:
    - group: 'default'
      paths-to-match:
        - '/**'
      packages-to-scan:
        - top.littlewin.codespark.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:your-api-key-here}
      model-name: deepseek-v4-flash
      max-tokens: 16384
#      strict-json-schema: true
#      response-format: json_object
      log-requests: true
      log-responses: false
    streaming-chat-model:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:your-api-key-here}
      model-name: deepseek-v4-flash
      max-tokens: 16384
      # 解析 delta.reasoning_content → TokenStream.onPartialThinking 事件，用于前端流式展示模型推理过程
      return-thinking: true
      log-requests: true
      log-responses: false
