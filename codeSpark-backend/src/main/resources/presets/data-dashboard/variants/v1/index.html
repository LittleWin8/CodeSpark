    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  #scene {
    position: fixed; inset: 0; display: block; width: 100%; height: 100%;
    touch-action: none; cursor: grab;
  }
  #scene:active { cursor: grabbing; }
  .hud-title {
    position: fixed; left: 34px; top: 30px; z-index: 5;
    max-width: min(44ch, 40vw); pointer-events: none;
  }
  .tag { display: flex; align-items: center; gap: 8px; font-size: 11px;
    letter-spacing: 0.18em; color: #5fd7ff; opacity: 0.85; }
  .tag .dot { width: 6px; height: 6px; border-radius: 50%; background: #4fe6ff;
    box-shadow: 0 0 10px #4fe6ff; animation: blink 1.8s ease-in-out infinite; }
  @keyframes blink {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: .25; transform: scale(.75); }
  }
  .hud-title h1 {
    font-size: 30px; font-weight: 600; letter-spacing: .06em; margin: 10px 0 8px;
    background: linear-gradient(90deg, #fff 0%, #8ce9ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hud-title p { font-size: 13px; line-height: 1.65; color: #8fb4cc; }
  .stats {
    position: fixed; right: 28px; top: 50%; transform: translateY(-50%);
    width: 188px; display: flex; flex-direction: column; gap: 12px; z-index: 5;
  }
  .card {
    padding: 10px 12px; border-radius: 10px;
    border: 1px solid rgba(78,190,255,.18);
    background: linear-gradient(160deg, rgba(16,44,68,.74), rgba(8,20,34,.54));
    box-shadow: 0 10px 26px -16px rgba(0,180,255,.75),
                inset 0 1px 0 rgba(120,220,255,.08);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .card-label { font-size: 11px; letter-spacing: .12em; color: #6fa7c4; }
  .card-value {
    margin-top: 4px; font-size: 20px; font-weight: 600; color: #9fe9ff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 14px rgba(60,200,255,.45);
  }
  .card-value .unit { font-size: 11px; font-weight: 400; margin-left: 3px; color: #5f93b0; }
  .card-bar { height: 2px; margin-top: 8px; border-radius: 2px;
    background: rgba(90,180,240,.14); overflow: hidden; }
  .card-bar i { display: block; height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, #1e79c8, #67f0ff); transition: width .8s ease; }
  @keyframes tick {
    0% { color: #fff; text-shadow: 0 0 22px rgba(140,245,255,.95); }
    100% {}
  }
  .tick { animation: tick .9s ease-out; }
  .hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 5; font-size: 11.5px; letter-spacing: .14em; color: #4d7d99;
    white-space: nowrap; pointer-events: none;
  }
  @media (max-width: 760px) {
    .hud-title { left: 16px; top: 16px; max-width: 76vw; }
    .hud-title h1 { font-size: 22px; margin: 7px 0 6px; }
    .hud-title p { font-size: 11.5px; }
    .tag { font-size: 10px; letter-spacing: .14em; }
    .stats {
      left: 12px; right: 12px; bottom: 12px; top: auto; width: auto;
      transform: none; flex-direction: row; flex-wrap: wrap; gap: 8px;
    }
    .card { flex: 1 1 calc(50% - 4px); padding: 8px 10px; border-radius: 8px; }
    .card-value { font-size: 16px; }
    .card-bar { display: none; }
    .hint { display: none; }
  }
</style>

        var x = lonToX(p[j][0]), y = latToY(p[j][1]);
        j ? g.lineTo(x, y) : g.moveTo(x, y);

      g.closePath(); g.fill();
    }

      g.beginPath();
      for (var j = 0; j < p.length; j++) {
        var x = lonToX(p[j][0]), y = latToY(p[j][1]);
        j ? g.lineTo(x, y) : g.moveTo(x, y);

      g.closePath(); g.stroke();
    }

  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  /* ---------- 旋转与投影 ---------- */
  function rotV(v, cY, sY, cX, sX) {
    var x1 = v.x * cY + v.z * sY;
    var z1 = -v.x * sY + v.z * cY;
    var y2 = v.y * cX - z1 * sX;
    var z2 = v.y * sX + z1 * cX;
    return { x:x1, y:y2, z:z2, s: 1 + 0.14 * z2 };
  }
  function screenX(rv) { return CX + rv.x * R; }
  function screenY(rv) { return CY - rv.y * R; }

  /* ---------- 球体：逐像素纹理映射 + 光照 ---------- */
  function renderGlobe(cY, sY, cX, sX) {
    var size = Math.round(Math.min(R * DPR * 2, MAXSIZE_CAP * bufScale) / 16) * 16;
    size = clamp(size, 112, MAXSIZE_CAP);
    ensureBuffer(size);

    var t0 = performance.now();
    var half = size * 0.5, inv = 1 / half;
    var data = bData, tex = TEXDATA, TW = TEX_W, TH = TEX_H;
    var Lx = LIGHT.x, Ly = LIGHT.y, Lz = LIGHT.z;

    for (var py = 0; py < size; py++) {
      var ny = (half - py - 0.5) * inv;
      var ny2 = ny * ny;
      var rowOff = py * size * 4;

      for (var px = 0; px < size; px++) {
        var o = rowOff + px * 4;
        var nx = (px - half + 0.5) * inv;
        var d2 = nx * nx + ny2;

        if (d2 >= 1) { data[o + 3] = 0; continue; }

        var nz = Math.sqrt(1 - d2);

        var yp =  ny * cX + nz * sX;
        var zp = -ny * sX + nz * cX;
        var ox =  nx * cY - zp * sY;
        var oz =  nx * sY + zp * cY;
        var oy = yp;
        if (oy > 1) oy = 1; else if (oy < -1) oy = -1;

        var lat = Math.asin(oy);
        var lon = Math.atan2(-oz, ox);
        var tx = ((lon * 0.159154943 + 0.5) * TW) | 0;
        var ty = ((0.5 - lat * 0.318309886) * TH) | 0;
        if (tx < 0) tx = 0; else if (tx >= TW) tx = TW - 1;
        if (ty < 0) ty = 0; else if (ty >= TH) ty = TH - 1;
        var ti = (ty * TW + tx) * 4;

        var ndl = nx * Lx + ny * Ly + nz * Lz;
        var sh = 0.22 + 0.90 * (ndl > 0 ? ndl : 0);
        var rk = 1 - nz;
        var rim = rk * rk * rk * 0.85;

        data[o]     = tex[ti]     * sh + 26  * rim;
        data[o + 1] = tex[ti + 1] * sh + 96  * rim;
        data[o + 2] = tex[ti + 2] * sh + 176 * rim;
        data[o + 3] = 255;
      }
    }

    bctx.putImageData(bImg, 0, 0);

    var cost = performance.now() - t0;
    costEMA = costEMA * 0.9 + cost * 0.1;
    if (costEMA > 7.5 && bufScale > 0.42) bufScale -= 0.03;
    else if (costEMA < 3.6 && bufScale < 1) bufScale += 0.015;

    ctx.drawImage(buf, CX - R, CY - R, R * 2, R * 2);
  }

  /* ---------- 经纬网格 ---------- */
  function drawGrid(cY, sY, cX, sX) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(88,196,255,0.10)';
    for (var i = 0; i < GRID.length; i++) {
      var line = GRID[i], started = false;
      ctx.beginPath();
      for (var j = 0; j < line.length; j++) {
        var rv = rotV(line[j], cY, sY, cX, sX);
        if (rv.z <= 0) { started = false; continue; }
        var x = screenX(rv), y = screenY(rv);
        if (!started) { ctx.moveTo(x, y); started = true; }
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- 飞线 ---------- */
  function updateArcs(dt) {
    for (var i = 0; i < ARCS.length; i++) {
      var a = ARCS[i];
      if (a.delay > 0) { a.delay -= dt; continue; }
      if (a.phase === 'grow') {
        a.p += a.speed * dt;
        if (a.p >= 1) { a.p = 1; a.phase = 'hold'; a.hold = rand(0.7, 1.8); }
      } else if (a.phase === 'hold') {
        a.hold -= dt;
        if (a.hold <= 0) a.phase = 'fade';
      } else {
        a.alpha -= dt * 1.3;
        if (a.alpha <= 0) {
          a.alpha = 1; a.p = 0; a.phase = 'grow';
          a.delay = rand(0.2, 2.0); a.speed = rand(0.22, 0.55);
        }
      }
    }
  }

  function drawArcs() {
    ctx.lineCap = 'round';
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < ARCS.length; i++) {
      var arc = ARCS[i];
      if (arc.delay > 0 || arc.alpha <= 0.01) continue;
      var A = CITIES[arc.a].rv, B = CITIES[arc.b].rv;
      if (!A || !B) continue;

      var fade = clamp(Math.min(A.z, B.z) * 3.2, 0, 1) * arc.alpha;
      if (fade <= 0.015) continue;

      var ax = screenX(A), ay = screenY(A);
      var bx = screenX(B), by = screenY(B);

      var mx = (ax + bx) / 2, my = (ay + by) / 2;
      var dx = mx - CX, dy = my - CY;
      var dl = Math.sqrt(dx*dx + dy*dy);
      if (dl < 1) { dx = -(by - ay); dy = bx - ax; dl = Math.sqrt(dx*dx + dy*dy) || 1; }
      var dist = Math.sqrt((bx-ax)*(bx-ax) + (by-ay)*(by-ay));
      var bulge = dist * 0.36 + 16;
      var cxp = mx + dx / dl * bulge;
      var cyp = my + dy / dl * bulge;

      var p = arc.p;
      var steps = Math.max(2, Math.round(32 * p));
      ctx.beginPath();
      for (var k = 0; k <= steps; k++) {
        var u = (k / steps) * p, iu = 1 - u;
        var px = iu*iu*ax + 2*iu*u*cxp + u*u*bx;
        var py = iu*iu*ay + 2*iu*u*cyp + u*u*by;
        k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.strokeStyle = 'rgba(88,218,255,' + (0.42 * fade).toFixed(3) + ')';
      ctx.lineWidth = 1.1;
      ctx.stroke();

      var u2 = p, iu2 = 1 - u2;
      var hx = iu2*iu2*ax + 2*iu2*u2*cxp + u2*u2*bx;
      var hy = iu2*iu2*ay + 2*iu2*u2*cyp + u2*u2*by;
      var gs = 15;
      ctx.globalAlpha = fade * 0.95;
      ctx.drawImage(glowSprite, hx - gs/2, hy - gs/2, gs, gs);
      ctx.globalAlpha = 1;
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- 城市光点 ---------- */
  function drawCities(t) {
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < CITIES.length; i++) {
      var c = CITIES[i], rv = c.rv;
      if (!rv || rv.z <= 0.02) continue;
      var sx = screenX(rv), sy = screenY(rv);
      var pulse = 0.5 + 0.5 * Math.sin(t * 2.2 + c.ph);
      var gs = (11 + pulse * 11) * rv.s;
      ctx.globalAlpha = 0.55 * rv.z * (0.55 + 0.45 * pulse);
      ctx.drawImage(glowSprite, sx - gs/2, sy - gs/2, gs, gs);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#c8f7ff';
      ctx.beginPath(); ctx.arc(sx, sy, 1.7 * rv.s, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- 旋转更新 ---------- */
  function updateRotation(dt) {
    if (dragging) return;
    rotY += spinY * dt;
    rotX = clamp(rotX + spinX * dt, -1.35, 1.35);
    spinY += (BASE_SPIN - spinY) * Math.min(1, dt * 1.6);
    spinX *= Math.pow(0.055, dt);
    if (Math.abs(spinX) < 0.002) spinX = 0;
    if (rotX >= 1.35 && spinX > 0) spinX = 0;
    if (rotX <= -1.35 && spinX < 0) spinX = 0;
  }

  /* ---------- 主循环 ---------- */
  var lastTime = 0;

  function render(t, dt) {
    zoom += (targetZoom - zoom) * Math.min(1, dt * 9);
    R = baseR * zoom;

    ctx.clearRect(0, 0, W, H);
    drawStars(t);

    var cY = Math.cos(rotY), sY = Math.sin(rotY);
    var cX = Math.cos(rotX), sX = Math.sin(rotX);

    renderGlobe(cY, sY, cX, sX);
    drawGrid(cY, sY, cX, sX);

    for (var i = 0; i < CITIES.length; i++) {
      CITIES[i].rv = rotV(CITIES[i].v, cY, sY, cX, sX);
    }
    drawArcs();
    drawCities(t);
  }

  function loop(now) {
    var t = now / 1000;
    var dt = lastTime ? (now - lastTime) / 1000 : 0.016;
    lastTime = now;
    dt = Math.min(dt, 0.05);

    updateArcs(dt);
    updateRotation(dt);
    render(t, dt);

    requestAnimationFrame(loop);
  }

  /* ---------- 交互 ---------- */
  var pointers = new Map();
  var lastMoveTs = 0, lastPinch = 0;

  canvas.addEventListener('pointerdown', function (e) {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    lastMoveTs = e.timeStamp / 1000;
    if (pointers.size === 1) dragging = true;
    else lastPinch = 0;
  });

  canvas.addEventListener('pointermove', function (e) {
    var ptr = pointers.get(e.pointerId);
    if (!ptr) return;
    var px = ptr.x, py = ptr.y;
    ptr.x = e.clientX; ptr.y = e.clientY;

    if (pointers.size === 1 && dragging) {
      var dx = ptr.x - px, dy = ptr.y - py;
      var nowTs = e.timeStamp / 1000;
      var dtMove = Math.max(nowTs - lastMoveTs, 0.008);
      lastMoveTs = nowTs;

      var dRotY = dx * 0.006, dRotX = dy * 0.006;
      rotY += dRotY;
      rotX = clamp(rotX + dRotX, -1.35, 1.35);

      spinY = clamp(dRotY / dtMove, -8, 8);
      spinX = clamp(dRotX / dtMove, -6, 6);
      return;
    }

    if (pointers.size >= 2) {
      var vals = [];
      pointers.forEach(function (v) { vals.push(v); });
      var d = Math.hypot(vals[0].x - vals[1].x, vals[0].y - vals[1].y);
      if (lastPinch > 4 && d > 4) {
        targetZoom = clamp(targetZoom * (d / lastPinch), 0.55, 2.6);
      }
      lastPinch = d;
    }
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    lastPinch = 0;
    if (pointers.size === 0) dragging = false;
    else lastMoveTs = e.timeStamp / 1000;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('lostpointercapture', endPointer);

  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    var f = Math.exp(-e.deltaY * 0.0012);
    targetZoom = clamp(targetZoom * f, 0.55, 2.6);
  }, { passive: false });

  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  /* ---------- 指标卡实时跳动 ---------- */
  var METRICS = [
    { el: document.getElementById('m-nodes'), bar: document.getElementById('b-nodes'),
      value: 12840, min: 11000, max: 16400, step: 95, fmt: 'int', unit: '' },
    { el: document.getElementById('m-traffic'), bar: document.getElementById('b-traffic'),
      value: 8.42, min: 6.1, max: 12.5, step: 0.22, fmt: 'dec', unit: 'TB/s' },
    { el: document.getElementById('m-cities'), bar: document.getElementById('b-cities'),
      value: 318, min: 300, max: 430, step: 2.4, fmt: 'int', unit: '' },
    { el: document.getElementById('m-req'), bar: document.getElementById('b-req'),
      value: 96240, min: 86000, max: 132000, step: 1400, fmt: 'int', unit: '' }
  ];

  function paintMetric(m) {
    var text = (m.fmt === 'dec')
      ? m.value.toFixed(2)
      : Math.round(m.value).toLocaleString('en-US');
    m.el.innerHTML = text + (m.unit ? '<span class="unit">' + m.unit + '</span>' : '');
    var ratio = (m.value - m.min) / (m.max - m.min);
    m.bar.style.width = (28 + ratio * 62).toFixed(1) + '%';
  }
  for (var mi = 0; mi < METRICS.length; mi++) paintMetric(METRICS[mi]);

  setInterval(function () {
    for (var i = 0; i < METRICS.length; i++) {
      var m = METRICS[i];
      m.value = clamp(m.value + (Math.random() - 0.48) * 2 * m.step, m.min, m.max);
      paintMetric(m);
      m.el.classList.remove('tick');
      void m.el.offsetWidth;
      m.el.classList.add('tick');
    }
  }, 2000);

  /* ---------- 启动 ---------- */
  resize();
  requestAnimationFrame(loop);

})();
</script>
</body>
