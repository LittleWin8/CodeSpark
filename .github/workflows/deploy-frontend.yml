name: deploy-frontend

# 只在前端目录（或本 workflow 文件）有改动时触发；也可在 Actions 页面手动触发
on:
  push:
    branches: [ master ]
    paths:
      - 'codeSpark-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

# 同一 workflow 的多次触发排队执行，避免上一次还没跑完下一次又开跑
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 启用 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: 打包前端
        working-directory: codeSpark-frontend
        # 站点个人信息（站长/备案/联系方式）通过仓库 Variables 构建时注入，不写入代码仓库
        env:
          VITE_SITE_NAME: ${{ vars.VITE_SITE_NAME }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_WEBMASTER_NAME: ${{ vars.VITE_WEBMASTER_NAME }}
          VITE_WEBMASTER_URL: ${{ vars.VITE_WEBMASTER_URL }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_ICP_NUMBER: ${{ vars.VITE_ICP_NUMBER }}
          VITE_GA_BEIAN_NUMBER: ${{ vars.VITE_GA_BEIAN_NUMBER }}
          VITE_GA_BEIAN_ICON: ${{ vars.VITE_GA_BEIAN_ICON }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 配置 SSH 连接
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: 上传前端产物
        run: |
          tar -czf dist.tar.gz -C codeSpark-frontend/dist .
          SSH_OPTS=(-i ~/.ssh/deploy_key -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          # timeout 300：跨境链路卡死时 5 分钟强制失败，不会无限挂住
          timeout 300 scp "${SSH_OPTS[@]}" dist.tar.gz root@${{ secrets.SERVER_HOST }}:/tmp/dist.tar.gz
          timeout 120 ssh "${SSH_OPTS[@]}" root@${{ secrets.SERVER_HOST }} "tar -xzf /tmp/dist.tar.gz -C /opt/codespark/frontend && rm -f /tmp/dist.tar.gz"
